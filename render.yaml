services:
  - type: web
    name: iddaa-ai-predictor
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: API_FOOTBALL_KEY
        sync: false
      - key: API_FOOTBALL_TIMEZONE
        value: Europe/Istanbul
      - key: MAX_ODDS_PAGES
        value: "9"
      - key: BULLETIN_CACHE_MS
        value: "10800000"
      - key: ALLOW_DEMO
        value: "false"
