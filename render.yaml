services:
  - type: web
    name: iddaa-ai-predictor
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: HIGHLIGHTLY_API_KEY
        sync: false
      - key: HIGHLIGHTLY_BASE_URL
        value: https://soccer.highlightly.net
      - key: HIGHLIGHTLY_TIMEZONE
        value: Europe/Istanbul
      - key: HIGHLIGHTLY_MAX_FORM_TEAMS
        value: "20"
      - key: BULLETIN_CACHE_MS
        value: "28800000"
      - key: ALLOW_DEMO
        value: "false"
