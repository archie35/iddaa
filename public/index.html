<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IDDAA AI Predictor</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>⚽ IDDAA AI Predictor</h1>
    <p>Gerçek fikstür, takım formu ve olasılık tabanlı maç analizi</p>
    <section class="controls">
      <label>Hangi analizi yapayım?
        <select id="marketType" required>
          <option value="" selected disabled>Önce analiz türünü seç</option>
          <option value="side">Taraf bahsi (1 / X / 2)</option>
          <option value="goals">Alt / Üst 2.5 gol</option>
          <option value="btts">KG Var / KG Yok</option>
        </select>
      </label>
      <button id="load" disabled>Maçları Analiz Et</button>
    </section>
    <div id="status"></div>
    <section id="matches" class="grid"></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
